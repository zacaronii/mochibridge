<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- mochibridge: a mochi bridge keeper on a red arched (taiko) bridge -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6E6"/><stop offset="1" stop-color="#FCE7C8"/>
    </linearGradient>
    <radialGradient id="mochi" cx="0.42" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3ECE6"/>
    </radialGradient>
  </defs>
  <clipPath id="tile"><rect x="4" y="4" width="120" height="120" rx="28"/></clipPath>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sky)"/>
  <g clip-path="url(#tile)">
  <!-- water -->
  <rect x="0" y="100" width="128" height="28" fill="#8CC3EA"/>
  <path d="M14 108 q6 -4 12 0 t12 0 M58 112 q6 -4 12 0 t12 0 M92 106 q6 -4 12 0" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- bridge: deck arc, railing, posts -->
  <path d="M8 101 Q64 58 120 101" stroke="#C23B31" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M8 101 Q64 58 120 101" stroke="#E2554A" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M18 86 Q64 50 110 86" stroke="#C23B31" stroke-width="4" fill="none" stroke-linecap="round"/>
  <g stroke="#C23B31" stroke-width="4" stroke-linecap="round">
    <line x1="22" y1="83" x2="22" y2="93"/><line x1="106" y1="83" x2="106" y2="93"/>
    <line x1="38" y1="73" x2="38" y2="84"/><line x1="90" y1="73" x2="90" y2="84"/>
  </g>
  </g>
  <!-- mochi keeper -->
  <ellipse cx="64" cy="76" rx="27" ry="6" fill="#000" opacity="0.10"/>
  <path d="M37 70 C37 48 50 40 64 40 C78 40 91 48 91 70 C91 77 80 80 64 80 C48 80 37 77 37 70 Z"
        fill="url(#mochi)" stroke="#3B2F2A" stroke-width="3"/>
  <!-- cap -->
  <path d="M46 46 C48 33 80 33 82 46 Z" fill="#2E4A7D" stroke="#1F3358" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M42 47 Q64 52 86 47" stroke="#1F3358" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="64" cy="40" r="4" fill="#F4C247" stroke="#C99A22" stroke-width="1.5"/>
  <!-- face -->
  <ellipse cx="54" cy="61" rx="3.2" ry="4" fill="#3B2F2A"/>
  <ellipse cx="74" cy="61" rx="3.2" ry="4" fill="#3B2F2A"/>
  <circle cx="55.2" cy="59.6" r="1.1" fill="#fff"/><circle cx="75.2" cy="59.6" r="1.1" fill="#fff"/>
  <ellipse cx="47" cy="67" rx="4.5" ry="2.6" fill="#F4A3A8" opacity="0.85"/>
  <ellipse cx="81" cy="67" rx="4.5" ry="2.6" fill="#F4A3A8" opacity="0.85"/>
  <path d="M60 67 q2 2.5 4 0 q2 2.5 4 0" stroke="#3B2F2A" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
