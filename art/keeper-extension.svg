<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- extension: the same mochi keeper, holding a red play-button lantern (YouTube), small bridge below -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEFF0"/><stop offset="1" stop-color="#FFD9DC"/>
    </linearGradient>
    <radialGradient id="mochi" cx="0.42" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3ECE6"/>
    </radialGradient>
  </defs>
  <clipPath id="tile"><rect x="4" y="4" width="120" height="120" rx="28"/></clipPath>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
  <!-- small bridge arc -->
  <path d="M0 114 Q64 80 128 114" stroke="#C23B31" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M0 114 Q64 80 128 114" stroke="#E2554A" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- mochi keeper (slightly left) -->
  <ellipse cx="54" cy="95" rx="26" ry="5.5" fill="#000" opacity="0.10"/>
  <path d="M28 88 C28 64 41 55 54 55 C67 55 80 64 80 88 C80 95 70 98 54 98 C38 98 28 95 28 88 Z"
        fill="url(#mochi)" stroke="#3B2F2A" stroke-width="3"/>
  <path d="M36 61 C38 48 70 48 72 61 Z" fill="#2E4A7D" stroke="#1F3358" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M32 62 Q54 67 76 62" stroke="#1F3358" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="54" cy="55" r="4" fill="#F4C247" stroke="#C99A22" stroke-width="1.5"/>
  <ellipse cx="45" cy="77" rx="3.2" ry="4" fill="#3B2F2A"/>
  <ellipse cx="63" cy="77" rx="3.2" ry="4" fill="#3B2F2A"/>
  <circle cx="46.2" cy="75.6" r="1.1" fill="#fff"/><circle cx="64.2" cy="75.6" r="1.1" fill="#fff"/>
  <ellipse cx="38" cy="83" rx="4.5" ry="2.6" fill="#F4A3A8" opacity="0.85"/>
  <ellipse cx="70" cy="83" rx="4.5" ry="2.6" fill="#F4A3A8" opacity="0.85"/>
  <path d="M50 83 q2 2.5 4 0 q2 2.5 4 0" stroke="#3B2F2A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- arm + lantern pole -->
  <path d="M78 80 Q86 76 90 68" stroke="#3B2F2A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <line x1="90" y1="70" x2="90" y2="26" stroke="#6B4B32" stroke-width="3.5" stroke-linecap="round"/>
  <!-- paper lantern (chōchin) with a small play mark -->
  <line x1="90" y1="26" x2="90" y2="31" stroke="#3B2F2A" stroke-width="2"/>
  <rect x="83" y="29" width="14" height="5" rx="2" fill="#3B2F2A"/>
  <rect x="83" y="62" width="14" height="5" rx="2" fill="#3B2F2A"/>
  <ellipse cx="90" cy="48" rx="15" ry="16" fill="#E8463B" stroke="#A3241D" stroke-width="2.5"/>
  <path d="M76.5 41 Q90 44 103.5 41 M75 48 Q90 51 105 48 M76.5 55 Q90 58 103.5 55" stroke="#C13328" stroke-width="1.6" fill="none"/>
  <ellipse cx="85" cy="43" rx="4" ry="6" fill="#FFFFFF" opacity="0.18"/>
  <path d="M86 42 L96 48 L86 54 Z" fill="#FFF3D6" stroke="#FFF3D6" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
