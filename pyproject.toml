[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mochibridge"
version = "0.1.0"
description = "Log Jellyfin, Kavita, Audiobookshelf and YouTube activity to kechimochi"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6", "ruamel.yaml>=0.18", "fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]

[project.scripts]
kbridge = "kbridge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kbridge = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs the throwaway kechimochi (scripts/kechimochi-test.sh up)"]
addopts = "-m 'not integration'"
